services:
  kontor:
    image: ghcr.io/reusing-code/kontor:0.0 
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data
      # Enable Banking private key (PEM), read-only:
      # - ./enablebanking.pem:/run/secrets/enablebanking.pem:ro
    environment:
      - PORT=8080
      - LOG_FORMAT=json
      - LOG_LEVEL=info
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or environment}
      # Optional OpenAI-compatible LLM endpoint; LLM features stay off while LLM_BASE_URL is unset.
      # - LLM_BASE_URL=http://llm-gateway:8080/v1
      # - LLM_MODEL=kontor
      # - LLM_API_KEY=${LLM_API_KEY}
      # - LLM_TIMEOUT=60s
      # Paperless draft pipeline polling interval (only runs with the LLM configured); 0 disables.
      # - PAPERLESS_PIPELINE_INTERVAL=15m
      # ECB exchange rates (Frankfurter API) for converting extracted non-EUR amounts; "off" disables.
      # - FX_RATES_URL=https://api.frankfurter.dev/v1
      # Public base URL of this Kontor, used for paperless back-links created through MCP.
      # - PUBLIC_URL=https://kontor.example.com
      # Automatic bank import through Enable Banking (needs ENCRYPTION_KEY and PUBLIC_URL);
      # off while the app ID and key path are unset. The redirect URL registered in the Enable
      # Banking app is PUBLIC_URL/api/v1/ledger/bank/callback. 0 disables only the automatic sync.
      # - ENABLE_BANKING_APP_ID=${ENABLE_BANKING_APP_ID}
      # - ENABLE_BANKING_KEY_PATH=/run/secrets/enablebanking.pem
      # - ENABLE_BANKING_SYNC_INTERVAL=24h

volumes:
  app-data:
