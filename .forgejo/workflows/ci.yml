name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/reusing-code/kontor
  CI_IMAGE: forgejo.reusing.dev/tobi/kontor-ci

jobs:
  # Builds the CI image only when its tag (tool versions + ci/Dockerfile hash)
  # is missing from the registry; frontend/backend run in it.
  ci-image:
    runs-on: docker
    container:
      image: docker:29.9.3-cli
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - name: Build and push if missing
        id: image
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          eval "$(ci/versions)"
          image="$CI_IMAGE:$CI_IMAGE_TAG"
          echo "image=$image" >> "$FORGEJO_OUTPUT"
          if [ -n "$PACKAGES_TOKEN" ]; then
            printf '%s' "$PACKAGES_TOKEN" | docker login "${CI_IMAGE%%/*}" -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          fi
          if out=$(docker manifest inspect "$image" 2>&1); then
            echo "$image exists, skipping build"
            exit 0
          fi
          case "$out" in
            *"manifest unknown"* | *"no such manifest"*) echo "$image missing, building" ;;
            *) echo "$out" >&2; exit 1 ;;
          esac
          [ -n "$PACKAGES_TOKEN" ] || { echo "$image missing and PACKAGES_TOKEN not set" >&2; exit 1; }
          docker build \
            --build-arg GO_VERSION="$GO_VERSION" \
            --build-arg BUN_VERSION="$BUN_VERSION" \
            --build-arg GOLANGCI_LINT_VERSION="$GOLANGCI_LINT_VERSION" \
            -t "$image" ci/
          docker push "$image"

  frontend:
    needs: ci-image
    runs-on: docker
    container:
      image: ${{ needs.ci-image.outputs.image }}
      volumes:
        - kontor-bun:/root/.bun/install/cache
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - run: ../ci/retry bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  backend:
    needs: ci-image
    runs-on: docker
    container:
      image: ${{ needs.ci-image.outputs.image }}
      volumes:
        - kontor-gomod:/go/pkg/mod
        - kontor-gocache:/root/.cache/go-build
        - kontor-golangci:/root/.cache/golangci-lint
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - run: ../ci/retry go mod download
      - run: go test ./...
      - run: golangci-lint run ./...

  docker:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: https://github.com/actions/checkout@v6

      - uses: https://github.com/docker/login-action@v4
        with:
          registry: ghcr.io
          username: reusing-code
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: https://github.com/docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$FORGEJO_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$FORGEJO_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$FORGEJO_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$FORGEJO_OUTPUT"
          echo "bun=$(node -p "require('./frontend/package.json').engines.bun")" >> "$FORGEJO_OUTPUT"
          echo "go=$(awk '$1 == "go" { print $2 }' backend/go.mod)" >> "$FORGEJO_OUTPUT"

      - uses: https://github.com/docker/setup-buildx-action@v4

      - uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            BUN_VERSION=${{ steps.version.outputs.bun }}
            GO_VERSION=${{ steps.version.outputs.go }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
