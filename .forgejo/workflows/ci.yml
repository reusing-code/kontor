name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/reusing-code/kontor

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: true
      - run: go test ./...
      - uses: https://github.com/golangci/golangci-lint-action@v9
        with:
          working-directory: backend

  docker:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: https://github.com/actions/checkout@v6

      - uses: https://github.com/docker/login-action@v4
        with:
          registry: ghcr.io
          username: reusing-code
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: https://github.com/docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$FORGEJO_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$FORGEJO_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$FORGEJO_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$FORGEJO_OUTPUT"

      - uses: https://github.com/docker/setup-buildx-action@v4

      - uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
