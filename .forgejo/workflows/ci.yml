name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: forgejo.reusing.dev/tobi/kontor
  MIRROR_IMAGE: ghcr.io/reusing-code/kontor
  CI_IMAGE: forgejo.reusing.dev/tobi/kontor-ci

jobs:
  # Builds the CI image only when its tag (tool versions + ci/Dockerfile hash)
  # is missing from the registry; frontend/backend run in it.
  ci-image:
    runs-on: docker
    container:
      image: docker:29.9.3-cli
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - name: Build and push if missing
        id: image
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          eval "$(ci/versions)"
          image="$CI_IMAGE:$CI_IMAGE_TAG"
          echo "image=$image" >> "$FORGEJO_OUTPUT"
          if [ -n "$PACKAGES_TOKEN" ]; then
            printf '%s' "$PACKAGES_TOKEN" | docker login "${CI_IMAGE%%/*}" -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          fi
          if out=$(docker manifest inspect "$image" 2>&1); then
            echo "$image exists, skipping build"
            exit 0
          fi
          case "$out" in
            *"manifest unknown"* | *"no such manifest"*) echo "$image missing, building" ;;
            *) echo "$out" >&2; exit 1 ;;
          esac
          [ -n "$PACKAGES_TOKEN" ] || { echo "$image missing and PACKAGES_TOKEN not set" >&2; exit 1; }
          docker build \
            --build-arg GO_VERSION="$GO_VERSION" \
            --build-arg BUN_VERSION="$BUN_VERSION" \
            --build-arg GOLANGCI_LINT_VERSION="$GOLANGCI_LINT_VERSION" \
            -t "$image" ci/
          docker push "$image"

  frontend:
    needs: ci-image
    runs-on: docker
    container:
      image: ${{ needs.ci-image.outputs.image }}
      volumes:
        - kontor-bun:/root/.bun/install/cache
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - run: ../ci/retry bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  backend:
    needs: ci-image
    runs-on: docker
    container:
      image: ${{ needs.ci-image.outputs.image }}
      volumes:
        - kontor-gomod:/go/pkg/mod
        - kontor-gocache:/root/.cache/go-build
        - kontor-golangci:/root/.cache/golangci-lint
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - run: ../ci/retry go mod download
      - run: go test ./...
      - run: golangci-lint run ./...

  # Builds on the persistent dind's default builder (local BuildKit cache, no
  # registry cache) and pushes to the Forgejo registry.
  docker:
    needs: [ci-image, frontend, backend]
    runs-on: docker
    if: github.event_name == 'push'
    container:
      image: ${{ needs.ci-image.outputs.image }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.build.outputs.tags }}
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - name: Login
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          [ -n "$PACKAGES_TOKEN" ] || { echo "PACKAGES_TOKEN not set" >&2; exit 1; }
          printf '%s' "$PACKAGES_TOKEN" | docker login "${IMAGE%%/*}" -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
      - name: Pull base images
        run: |
          eval "$(ci/versions)"
          export BUN_VERSION GO_VERSION
          images=$(ci/base-images)
          for img in $images; do
            docker pull -q "$img" || echo "::warning::pull failed, using cached $img"
          done
      - name: Build and push
        id: build
        run: |
          eval "$(ci/versions)"
          sha=$(printf '%.7s' "$GITHUB_SHA")
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF_NAME#v}
              tags=$version
              if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                tags="$tags ${version%.*} latest"
              fi
              ;;
            *)
              version=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')
              tags=$version
              ;;
          esac
          tags="sha-$sha $tags"
          echo "tags: $tags"
          set --
          for t in $tags; do set -- "$@" -t "$IMAGE:$t"; done
          docker buildx build --push "$@" \
            --label org.opencontainers.image.title=Kontor \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg COMMIT="$sha" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%d)" \
            --build-arg BUN_VERSION="$BUN_VERSION" \
            --build-arg GO_VERSION="$GO_VERSION" \
            .
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$sha" --format '{{.Manifest.Digest}}')
          echo "pushed $IMAGE@$digest"
          echo "digest=$digest" >> "$FORGEJO_OUTPUT"
          echo "tags=$tags" >> "$FORGEJO_OUTPUT"

  # Copies the pushed image unchanged to ghcr.io, which compose.yml and the
  # deployment pull from. Separate job so a ghcr.io outage only needs a re-run.
  mirror-ghcr:
    needs: [ci-image, docker]
    runs-on: docker
    if: github.event_name == 'push'
    container:
      image: ${{ needs.ci-image.outputs.image }}
    steps:
      - name: Checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: basic $auth" \
            fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - name: Login
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$PACKAGES_TOKEN" | docker login "${IMAGE%%/*}" -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          ci/retry sh -c 'printf "%s" "$GHCR_TOKEN" | docker login ghcr.io -u reusing-code --password-stdin'
      - name: Copy tags
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
          TAGS: ${{ needs.docker.outputs.tags }}
        run: |
          set --
          for t in $TAGS; do set -- "$@" -t "$MIRROR_IMAGE:$t"; done
          ci/retry docker buildx imagetools create --prefer-index=false "$@" "$IMAGE@$DIGEST"
          for t in $TAGS; do
            got=$(docker buildx imagetools inspect "$MIRROR_IMAGE:$t" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "$MIRROR_IMAGE:$t is $got, expected $DIGEST" >&2; exit 1; }
          done
          echo "mirrored $DIGEST as $TAGS"
