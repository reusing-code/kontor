version: "3"

tasks:
  ci:
    desc: Run the same local checks expected by CI
    deps:
      - ci:backend
      - ci:frontend

  ci:backend:
    desc: Run backend test and lint checks
    dir: backend
    cmds:
      - task test
      - task lint

  ci:frontend:
    desc: Run frontend lint and build checks
    dir: frontend
    cmds:
      - bun run lint
      - bun run build

  dev:
    desc: Run backend and frontend concurrently
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    desc: Run backend with Air
    dir: backend
    cmds:
      - task dev

  dev:frontend:
    desc: Run frontend dev server
    dir: frontend
    cmds:
      - bun run dev

  dev:clean-db:
    desc: Delete the local dev database (backend/data)
    dir: backend
    cmds:
      - task clean-db

  build:
    desc: Build Docker image
    vars:
      BUN_VERSION:
        sh: bun -p "require('./frontend/package.json').engines.bun"
    cmds:
      - docker build --build-arg BUN_VERSION={{.BUN_VERSION}} -t kontor .

  up:
    desc: Start with docker compose
    cmds:
      - docker compose up -d

  down:
    desc: Stop docker compose
    cmds:
      - docker compose down
